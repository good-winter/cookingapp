name: cooking_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 国际化（设置页的语言切换用）
  flutter_localizations:
    sdk: flutter
  intl: any

  # 核心依赖库
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  dio: ^5.4.1
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  image_picker: ^1.0.7

  # 系统自带图标库
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 开启国际化代码生成（配合根目录 l10n.yaml）
  generate: true

  # 如果你以后有图片资源，可以在下面添加 assets
  # assets:
  #   - images/a_dot_burr.jpeg